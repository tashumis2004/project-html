<!doctype html>
<html>
<head>
    <title>product card</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }
        .product{
            width: 300px;
            background-color: white;
            margin: 50px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 12px gray;
            text-align: center;
        }
        .product img {
            width: 100%;
            border-radius: 10px;
        }
        .price {
            color: green;
            font-size: 24px;
            font-weight: bold;
        }
        button {
            background-color: #ff6600;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #cc5200;
        }
    </style>
</head>
        <body>
         <div class="product">
            <img src="https://via.placeholder.com/300x200" alt="laptop">
            <h2>"laptop"</h2>
            <p>intel core i5, 8GB RAM </p>       
            <p class="price">$550</p>
            <button>Add to Cart</button>
        </div>
        <body>
</html>
