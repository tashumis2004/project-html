<!DOCTYPE html>
<html>
<head>
    <title>My Clothing Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: black; color: white; padding: 20px; text-align: center; }
        nav { background: #333; padding: 10px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; }
        .products { display: flex; flex-wrap: wrap; justify-content: center; margin: 20px; }
        .product { border: 1px solid #ccc; margin: 10px; padding: 15px; width: 200px; text-align: center; }
        .product img { width: 100%; height: auto; }
        footer { background: black; color: white; text-align: center; padding: 15px; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>Swapnil's Clothing Store</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Contact</a>
    </nav>

    <div class="products">
        <div class="product">
            <img src="shirt.jpg" alt="Shirt">
            <h3>Casual Shirt</h3>
            <p>₹499</p>
        </div>
        <div class="product">
            <img src="jeans.jpg" alt="Jeans">
            <h3>Blue Jeans</h3>
            <p>₹999</p>
        </div>
        <div class="product">
            <img src="jacket.jpg" alt="Jacket">
            <h3>Leather Jacket</h3>
            <p>₹1999</p>
        </div>
    </div>

    <footer>
        <p>Contact us: swapnil@example.com | Instagram: @swapnilstore</p>
    </footer>
</body>
</html>
